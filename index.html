<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yface - Grow Your YouTube Channel with AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a2e4a 100%);
      color: #f1f5f9;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 2rem;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #2563eb 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .form-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .optional {
      font-weight: 400;
      color: #cbd5e1;
      font-size: 0.85rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input::placeholder, textarea::placeholder {
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      animation: slideIn 0.3s ease;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 2rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .form-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">YFACE</div>
      <h1>Grow Your YouTube Channel with AI</h1>
      <p class="subtitle">Join our mentorship program and learn faceless channel automation</p>
    </header>

    <div class="form-card">
      <div id="message" class="message"></div>

      <form id="enrollForm">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required>
        </div>

        <div class="form-group">
          <label for="source">How did you hear about us? *</label>
          <select id="source" name="source" required>
            <option value="">-- Select an option --</option>
            <option value="youtube">YouTube</option>
            <option value="telegram">Telegram</option>
            <option value="friend">Referred by a friend</option>
            <option value="instagram">Instagram</option>
            <option value="twitter">Twitter/X</option>
            <option value="linkedin">LinkedIn</option>
            <option value="google">Google Search</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="niche">What niche are you interested in? <span class="optional">(optional)</span></label>
          <input type="text" id="niche" name="niche" placeholder="e.g., Tech, Finance, Education">
        </div>

        <button type="submit" id="submitBtn">Enroll Now</button>
      </form>
    </div>

    <footer>
      <p>&copy; 2024 Yface Mentorship. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('enrollForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const source = document.getElementById('source').value;
      const niche = document.getElementById('niche').value.trim();

      // Basic validation
      if (!name || !email || !phone || !source) {
        showMessage('Please fill all required fields', 'error');
        return;
      }

      // Disable button
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Submitting...';

      try {
        // Send to n8n webhook
        const response = await fetch('https://fearxrises.app.n8n.cloud/webhook-test/yface', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            name,
            email,
            phone,
            source,
            niche: niche || 'Not specified',
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          showMessage('✓ Lead submitted successfully! We\'ll contact you soon!', 'success');
          form.reset();
        } else {
          showMessage('✗ Something went wrong. Please try again.', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('✗ Network error. Please check your connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Enroll Now';
      }
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message show ${type}`;
      
      setTimeout(() => {
        messageDiv.className = 'message';
      }, 5000);
    }
  </script>
</body>
</html>
